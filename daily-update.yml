name: Daily Portfolio Data Refresh

on:
  push:
    paths:
      - "input/*.xlsx"
      - "update_daily.py"
      - ".github/workflows/daily-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate all five input files exist
        run: |
          test -f input/current.xlsx
          test -f input/daily_kp.xlsx
          test -f input/31-60.xlsx
          test -f input/61-90.xlsx
          test -f input/90+.xlsx
      - name: Refresh dashboard data
        run: python update_daily.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "Daily portfolio data refresh"
          git push
